<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        .login-box {
            background-color: white;
            width: 300px;
            padding: 25px;
            margin: 100px auto;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Student Login</h2>

        <form>
            <input type="text"
                   placeholder="Enter Username">

            <input type="password"
                   placeholder="Enter Password">

            <br><br>

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
